<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="description" content="JIFTv: transmissões ao vivo e arquivo dos Jogos Interescolares do IFSC, com streaming adaptativo." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Twitter: card ao compartilhar em redes sociais e mensageiros. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JIFTv" />
    <meta property="og:title" content="JIFTv · Jogos IFSC ao vivo" />
    <meta property="og:description" content="Transmissões ao vivo e arquivo dos Jogos Interescolares do IFSC." />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />

    <title>JIFTv · Jogos IFSC ao vivo</title>

    <script>
      // Anti-flash: aplica o tema antes do primeiro paint.
      (function () {
        try {
          var saved = localStorage.getItem("jiftv-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
