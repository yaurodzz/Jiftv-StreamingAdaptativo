user www-data;
# O módulo RTMP precisa de um único worker para que publicação e reprodução
# fiquem no mesmo processo (um worker do nginx atende milhares de conexões HTTP).
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

include /etc/nginx/modules-enabled/*.conf;   # carrega o libnginx-mod-rtmp

events {
    worker_connections 4096;
}

# ---------------------------------------------------------------------------
# RTMP - ingestão, transcodificação, HLS e gravação
# ---------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        notify_method get;

        # Ponto de entrada: o OBS/DroidCam publica em rtmp://<servidor>/live com a
        # chave criada no painel
        application live {
            live on;
            drop_idle_publisher 15s;

            # A API valida a chave e a troca pelo nome público da transmissão
            # (redirecionamento do on_publish); também marca a transmissão como ao vivo.
            on_publish http://127.0.0.1:8081/internal/publish;
            on_publish_done http://127.0.0.1:8081/internal/publish_done;

            # Somente o FFmpeg interno pode ler o sinal original
            allow play 127.0.0.1;
            deny play all;

            # FFmpeg: transcodifica para as múltiplas qualidades (HLS + DASH + miniatura)
            exec_push /opt/jiftv/bin/transcode.sh $name;
            exec_kill_signal term;

            # Gravação nativa do nginx-rtmp: um único arquivo por transmissão
            record all;
            record_path /recordings/em_andamento;
            record_suffix _%Y-%m-%d_%H-%M-%S.flv;
            # Ao terminar: converte para MP4, salva na pasta local e avisa a API,
            # que registra no acervo e envia ao Cloudinary
            exec_record_done /opt/jiftv/bin/on_record_done.sh $path $name;
        }

        # Recebe as qualidades geradas pelo FFmpeg e monta o HLS adaptativo
        application hls {
            live on;
            allow publish 127.0.0.1;
            deny publish all;
            deny play all;

            hls on;
            hls_path /var/www/hls;
            hls_nested on;
            hls_fragment 2s;
            hls_playlist_length 20s;
            hls_fragment_slicing aligned;
            hls_cleanup on;

            # Playlist mestre <nome>.m3u8 com uma variante por qualidade
            include /etc/nginx/jiftv/hls_variants.conf;
        }
    }
}

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    access_log off;
    # O player tenta reconectar enquanto a transmissão não começa: 404 é esperado
    log_not_found off;

    # DNS interno do Docker: encontra o container da API mesmo depois de reiniciado
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # ---------------- público (porta 80 -> HTTP_PORT do .env) ----------------
    # O site fica no Firebase Hosting; este servidor entrega só o vídeo.
    # Em produção ele é publicado por HTTPS (túnel da Cloudflare ou domínio próprio),
    # porque um site HTTPS não pode carregar vídeo de um endereço HTTP.
    server {
        listen 80;
        set $api api:8000;

        location = / {
            default_type text/plain;
            return 200 "JIFTv - servidor de midia (HLS, DASH e gravacoes)
";
        }

        location ^~ /hls/ {
            alias /var/www/hls/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /dash/ {
            alias /var/www/dash/;
            types {
                application/dash+xml mpd;
                video/mp4 m4s mp4;
            }
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
        }

        # Miniaturas das transmissões ao vivo (atualizadas pelo FFmpeg a cada 5 s)
        location ^~ /thumbs/ {
            alias /var/www/thumbs/;
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
        }

        # Acervo de gravações. O worker decide quem pode ver: gravações visíveis são
        # públicas; as ocultas exigem ?token=<ID token do Firebase de um admin>.
        location ^~ /arquivos/ {
            alias /recordings/videos/;
            auth_request /_auth/arquivo;
            types {
                video/mp4 mp4;
                video/x-flv flv;
                image/jpeg jpg;
            }
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin * always;
        }

        location = /_auth/arquivo {
            internal;
            proxy_pass http://$api/api/arquivo-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Jiftv-Public 1;
        }

        # Contagem de espectadores (o CORS é tratado pelo worker)
        location ^~ /api/ {
            proxy_pass http://$api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Marca a requisição como externa: o worker recusa os ganchos internos
            proxy_set_header X-Jiftv-Public 1;
            proxy_redirect off;
            client_max_body_size 16k;
            add_header Cache-Control no-store always;
        }

        # Relógio do servidor para sincronização do dash.js
        location = /time {
            default_type text/plain;
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
            return 200 $time_iso8601;
        }

        location = /healthz {
            default_type text/plain;
            return 200 ok;
        }
    }

    # ---------------- interno (porta 8081, só na rede do Docker) ----------------
    server {
        listen 8081;
        set $api api:8000;

        # Estatísticas do nginx-rtmp (lidas pela API)
        location = /stat {
            rtmp_stat all;
        }

        # Controle do nginx-rtmp (a API usa para derrubar uma transmissão)
        location /control {
            rtmp_control all;
        }

        # Ganchos do RTMP e dos scripts -> API
        location ^~ /internal/ {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://$api;
            proxy_set_header X-Jiftv-Public "";
            proxy_redirect off;
        }
    }
}
